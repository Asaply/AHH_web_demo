name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx astro build

      # Pages serves this project from /AHH_web_demo/, so every root-absolute
      # URL in the built HTML and CSS needs that prefix.
      - name: Prefix root-absolute URLs with the repo path
        run: |
          find dist -type f \( -name '*.html' -o -name '*.css' \) -print0 \
            | xargs -0 sed -i "s#=\"/#=\"/AHH_web_demo/#g; s#url(/#url(/AHH_web_demo/#g; s#url('/#url('/AHH_web_demo/#g"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
